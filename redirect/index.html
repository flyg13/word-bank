<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harlie's Word Bank has moved</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://wordbank.flyinggiraffe.ai/">
<meta http-equiv="refresh" content="0; url=https://wordbank.flyinggiraffe.ai/">
<script>
  // Runs before the meta refresh in practice, and carries any query string or
  // fragment across. replace() rather than assign() so the back button does not
  // land you here again in a loop.
  (function () {
    var target = 'https://wordbank.flyinggiraffe.ai/' + location.search + location.hash;
    location.replace(target);
  })();
</script>
<style>
  body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:#132821;color:#f3ede0;margin:0;padding:48px 20px;text-align:center;}
  a{color:#e8a33d;}
  p{color:#b9c9c1;line-height:1.6;max-width:32em;margin:12px auto;}
</style>
</head>
<body>
  <h1>Harlie's Word Bank has moved 🌱</h1>
  <p>
    It now lives at
    <a href="https://wordbank.flyinggiraffe.ai/">wordbank.flyinggiraffe.ai</a>.
    You should be sent there automatically.
  </p>
  <p>
    Worth updating the bookmark on each device. Nothing has been lost — her word
    bank is safe, and the new address will ask for the family code once.
  </p>
</body>
</html>
