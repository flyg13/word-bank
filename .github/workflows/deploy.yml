# The app is served from https://wordbank.flyinggiraffe.ai by Netlify.
#
# GitHub Pages stays alive only to redirect the old address,
# https://flyg13.github.io/word-bank/, so bookmarks and any link already out
# there keep working. Pages serves static files and cannot issue a real 301, so
# the redirect is a page that does it three ways: a script (which also carries
# the query string and fragment across), a meta refresh behind it, and a plain
# link if both are blocked.
name: Redirect old GitHub Pages URL

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the redirect site
        # 404.html catches any deeper path under /word-bank/ and redirects it
        # the same way, rather than showing GitHub's own 404.
        run: |
          mkdir -p _site
          cp redirect/index.html _site/index.html
          cp redirect/index.html _site/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
